[package]
name = "cloth-viewer"
version = "0.1.0"
license = "GPL-3.0-only"
edition = "2021"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy = { version = "0.20", default-features = false, features = [
    "bevy_animation",
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_gltf",
    "bevy_world_serialization",
    "gltf_animation",
    "morph_animation",
    "bevy_image",
    "bevy_log",
    "bevy_pbr",
    "bevy_render",
    "bevy_scene",
    "bevy_camera",
    "bevy_light",
    "bevy_mesh",
    "bevy_shader",
    "jpeg",
    "png",
    "raw_vulkan_init",
    "debug",
    "std",
    "multi_threaded",
] }

[profile.dev]
opt-level = 1
