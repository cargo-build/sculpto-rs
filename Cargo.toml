[workspace]
members = ["crates/sculpto-core", "crates/sculpto-cli", "crates/sculpto-bake", "crates/sculpto-mesh", "crates/sculpto-nif", "crates/boethos", "crates/boethos-catalogue", "crates/boethos-cli", "crates/sculpto-engine", "crates/sculpto-gltf", "crates/sculpto-blender", "tools/span-manifest", "tools/tripo-split"]
exclude = ["vendor/byroredux", "tools/bevy-viewer"]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only" # operator decision 2026-11-02; see DECL0006.
repository = "https://github.com/cargo-build/sculpto-rs"

[workspace.dependencies]
sculpto-core = { path = "crates/sculpto-core" }
sculpto-bake = { path = "crates/sculpto-bake" }
sculpto-mesh = { path = "crates/sculpto-mesh" }
sculpto-nif = { path = "crates/sculpto-nif" }
sculpto-engine = { path = "crates/sculpto-engine" }
sculpto-gltf = { path = "crates/sculpto-gltf" }
sculpto-blender = { path = "crates/sculpto-blender" }
roxmltree = "0.21"
glam = "0.34"
toml = "0.9"

# Builds are the bottleneck of this project and debug info is pure cost: no
# gate reads a debugger, and it multiplies both compile time and target size
# (33 jj workspaces held 421 GB of `target/`). Operator decision 2026-11-17.
[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.dev.build-override]
debug = 0
