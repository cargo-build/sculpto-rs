[package]
name = "sculpto-gltf"
description = "glTF adapter: write Sculpto meshes to skinned GLB."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sculpto-core.workspace = true
serde_json = { version = "1", features = ["arbitrary_precision"] }
gltf = { version = "1", default-features = false, features = ["names", "extras"] }
