[package]
name = "boethos-cli"
description = "Agent-first CLI for the boethos asset catalogue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["assets", "catalogue", "gamedev", "cli"]
categories = ["command-line-utilities", "game-development"]

[[bin]]
name = "boethos"
path = "src/main.rs"

[dependencies]
boethos = { version = "0.1.0", path = "../boethos" }
boethos-catalogue = { version = "0.1.0", path = "../boethos-catalogue" }
serde_json = "1"
