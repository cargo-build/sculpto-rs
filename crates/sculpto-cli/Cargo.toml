[package]
name = "sculpto-cli"
description = "Command-line entry point for Sculpto document inspection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "sculpto"
path = "src/main.rs"

[dependencies]
sculpto-core.workspace = true
sculpto-bake.workspace = true
sculpto-mesh.workspace = true
sculpto-nif.workspace = true
sculpto-engine.workspace = true
serde_json = "1"

[dev-dependencies]
gltf = { version = "=1.4.1", default-features = false }
