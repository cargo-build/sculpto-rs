[package]
name = "boethos-catalogue"
description = "Asset, preset and face catalogue kinds for the boethos store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["assets", "catalogue", "gamedev", "redb"]
categories = ["game-development", "database"]

[dependencies]
boethos = { version = "0.2.0", path = "../boethos" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
