[package]
name = "boethos"
description = "Typed, transactional artifact records and links over an embedded redb store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["storage", "redb", "database", "artifacts"]
categories = ["database"]

[dependencies]
redb = "4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
