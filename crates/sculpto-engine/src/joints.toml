# Joint articulation schema: type, axis (bone frame), limits.
#
# Product data for the 65-joint Mixamo palette; the engine parses this file
# (sculpto-engine/src/joints.rs) and enforces it through `sculpto actor joints`.
#
# Frames: `axis` is the axis in the driven bone's own rest-local frame, measured
# on the Mixamo reference rig Y_Bot.glb (sha256 b7c58bf206e5..., T-pose rest,
# Y along the bone). `anchor` is the same axis as a world direction in that rest,
# the rig-agnostic route used when the actor's palette is not mixamorig and the
# entry is resolved by anatomical role instead of name.
#
# Signs: positive is the anatomical movement named by the axis. Hinge families
# (elbow, knee, toes, finger PIP/DIP) are sign-calibrated on the healthy Mixamo
# walk (sha256 875f9ce148eb..., observed: knee 16-68, elbow 24-66, hip 10-40,
# toes 0-55 deg extension). Axes without a calibration carry a symmetric envelope
# so an unknown sign cannot produce a wrong violation.
#
# Limit bases: `anatomical` = cited value used directly; `envelope` = conservative
# working bound derived from a cited complex total (derivation stated in the note);
# unresolved splits say what measurement would settle them. A made-up number is
# worse than a hole, and the holes are named.

schema_version = 1
palette = "mixamorig"
rest = "T-pose"

[[joint]]
name = "mixamorig:Hips"
role = "pelvis"
type = "root"
slack_deg = 0
axis_basis = "measured"
note = "The pelvis is the root: 6-DOF, no articulation limit by design. The operator's open question about the pelvis (recorded verbatim in the owning issue) resolves structurally: what bends above it is the spine chain, what hangs from it are the hips."

[[joint]]
name = "mixamorig:Spine"
role = "spine0"
type = "ball"
slack_deg = 10
axis_basis = "measured"
note = "Spine segment: 3-DOF with coupled limits. The VA/Physiopedia values are for the thoracolumbar spine as a single segment (flexion 90, extension 30, lateral 30, rotation 30 each); the per-segment split across Spine/Spine1/Spine2 is unresolved. The envelope below is the conservative total/3; settle the split with a MOCAP norm dataset or a flush test per segment."

[[joint.axis]]
name = "flexion"
axis = [1, -0.0001, 0]
anchor = [1, 0, 0]
min_deg = -10
max_deg = 30
basis = "envelope"
cite = "VA/Physiopedia thoracolumbar single-segment: extension 30, flexion 90"
note = "positive = bend forward"

[[joint.axis]]
name = "lateral"
axis = [0, 0.0057, -1]
anchor = [0, 0, -1]
min_deg = -10
max_deg = 10
basis = "envelope"
cite = "VA/Physiopedia: lateral flexion 30 each; /3"
note = ""

